<!DOCTYPE html>
<html lang="en">

        .active { display:flex; }
        h1 { color:#ff0066; text-shadow:0 0 20px #ff0066; font-size:26px; }
        button { background:#ff0066; color:white; border:none; padding:16px 32px; margin:10px; font-size:18px; border-radius:50px; width:85%; }
        .hypno { background:#0a0a0a; animation:pulse 700ms infinite; }
        @keyframes pulse { 0%{opacity:0.65} 50%{opacity:1} }
        img { max-height:58vh; border:6px solid #ff3366; box-shadow:0 0 30px #ff0066; }
        .progress { width:85%; background:#222; height:25px; border:2px solid #ff0066; margin:15px 0; }
        .bar { height:100%; background:linear-gradient(to right, #ff0066, #ff99aa); }
        .evidence { background:#1a001a; width:90%; padding:15px; border:2px solid #ff0066; margin:10px; max-height:180px; overflow:auto; text-align:left; font-size:14px; }
    </style>
</head>
<body>

<!-- SLAVE / HYPNOSIS MODE -->

    <img id="hypnoImage" src="https://picsum.photos/id/1015/800/1200" style="max-height:55vh;">

    <button onclick="exitSlaveEarly()">I Am Too Weak & Unworthy</button>
</div>

<!-- MAIN APP -->
<div id="mainScreen" class="screen">
    <h1>🦶 HOLY GRAIL FOOT DRONE v5.1 🦶</h1>
    <p>Day <span id="day">1</span>/90 | Phase: <strong id="phaseDisplay">Foot Beta</strong></p>
    <div class="progress"><div id="progressBar" class="bar" style="width:25%"></div></div>
    <p id="progressText">25% → Sock Beta</p>

    <div class="evidence">
        <h2>Evidence Vault</h2>
        <div id="evidenceLog"></div>
    </div>

    <button onclick="enterSlaveMode()">Slave Hypnosis (2min)</button>
    <button onclick="dailyTasks()">Daily Tasks</button>
    <button onclick="showMantra()">Daily Mantra</button>
    <button onclick="edgingTimer()">Edging Timer</button>
    <button onclick="viewProgress()">My Progress</button>
</div>

<script>
// Better foot images for normal girls / influencers style
const footImages = [
    "https://picsum.photos/id/1015/800/1200", // wrinkled sole
    "https://picsum.photos/id/669/800/1200",  // toes
    "https://picsum.photos/id/201/800/1200",
    "https://picsum.photos/id/237/800/1200",
    "https://picsum.photos/id/106/800/1200",
    "https://picsum.photos/id/133/800/1200"
];

let day = 1;
let phase = "Foot Beta";
let progress = 25;
let evidence = [];

function addEvidence(text) {
    evidence.unshift({day: day, time: new Date().toLocaleTimeString(), entry: text});
    renderEvidence();
}

function renderEvidence() {
    document.getElementById("evidenceLog").innerHTML = evidence.map(e => `<small>Day ${e.day} \( {e.time}</small><br> \){e.entry}<hr>`).join("");
}

function enterSlaveMode() {
    document.getElementById("mainScreen").classList.remove("active");
    document.getElementById("slaveScreen").classList.add("active");
    
    let timeLeft = 120;
    let i = 0;
    const interval = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").textContent = timeLeft;
        i = (i + 1) % footImages.length;
        document.getElementById("hypnoImage").src = footImages[i];
        
        if (Math.random() > 0.7) {
            document.getElementById("hypnoText").textContent = "You are unworthy... Stare at normal girls' feet... Melt your brain...";
        }
        
        if (timeLeft <= 0) {
            clearInterval(interval);
            alert("Good unworthy drone. You obeyed Mistress Echo.");
            exitSlaveMode();
        }
    }, 1000);
}

function exitSlaveMode() {
    document.getElementById("slaveScreen").classList.remove("active");
    document.getElementById("mainScreen").classList.add("active");
    addEvidence("✅ Completed Hypnosis Session");
    progress = Math.min(100, progress + 12);
    updateProgress();
}

function exitSlaveEarly() {
    if (confirm("Too weak and unworthy?")) exitSlaveMode();
}

function updateProgress() {
    document.getElementById("progressBar").style.width = progress + "%";
    document.getElementById("progressText").textContent = `${progress}% to next phase`;
    document.getElementById("phaseDisplay").textContent = phase;
    document.getElementById("day").textContent = day;
}

function dailyTasks() {
    alert(`Day ${day} - Foot Beta\n\nTask: Find 10 pics of NORMAL TikTok/Instagram influencers showing bare feet or socks.\n\nPaste summary + URLs.`);
    let summary = prompt("Your answers + image URLs:");
    if (summary) {
        addEvidence(`📸 Daily Task: ${summary}`);
        progress = Math.min(100, progress + 15);
        updateProgress();
    }
}

function showMantra() {
    const m = "I am unworthy of real women. Only their feet own a beta like me.";
    alert(`Repeat 50 times out loud:\n\n${m}`);
    addEvidence(`Mantra: ${m}`);
}

function edgingTimer() {
    alert("15 minute edging session. Only normal girls' feet. No orgasm.");
    addEvidence("Edged 15min - Denied");
}

function viewProgress() {
    alert(`Status:\nPhase: ${phase}\nDay: ${day}/90\nProgress: ${progress}%\nYou are not worthy of better.`);
}

// Init
addEvidence("🚀 Training Started Under Mistress Echo");
document.getElementById("mainScreen").classList.add("active");
updateProgress();
</script>

</html>
