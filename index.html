<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦶 HOLY GRAIL FOOT DRONE v4 🦶</title>
    <style>
        body { margin:0; font-family:Arial; background:#000; color:#ff3366; text-align:center; overflow:hidden; }
        .screen { display:none; height:100vh; flex-direction:column; justify-content:center; align-items:center; padding:10px; }
        .active { display:flex; }
        h1 { color:#ff0066; text-shadow:0 0 20px #ff0066; font-size:26px; }
        button { background:#ff0066; color:white; border:none; padding:16px 32px; margin:10px; font-size:18px; border-radius:50px; width:85%; }
        .hypno { background:#0a0a0a; animation:pulse 700ms infinite; }
        @keyframes pulse { 0%{opacity:0.65} 50%{opacity:1} }
        img { max-height:58vh; border:6px solid #ff3366; box-shadow:0 0 30px #ff0066; }
        .progress { width:85%; background:#222; height:25px; border:2px solid #ff0066; margin:15px 0; }
        .bar { height:100%; background:linear-gradient(to right, #ff0066, #ff99aa); }
        .evidence { background:#1a001a; width:90%; padding:15px; border:2px solid #ff0066; margin:10px; max-height:160px; overflow:auto; text-align:left; font-size:14px; }
    </style>
</head>
<body>

<!-- SLAVE / HYPNOSIS MODE -->
<div id="slaveScreen" class="screen active hypno">
    <h1>FOOT HYPNOSIS — EYES LOCKED</h1>
    <p id="hypnoText" style="font-size:26px; min-height:80px; color:#ff99aa;">You are a mindless foot drone... Deeper... Only feet exist...</p>
    <img id="hypnoImage" src="https://picsum.photos/id/1015/800/1200" style="max-height:55vh;">
    <p>Timer: <span id="timer">120</span>s — STARE. NO LOOKING AWAY.</p>
    <button onclick="exitSlaveEarly()">I Am Weak Beta</button>
</div>

<!-- MAIN APP -->
<div id="mainScreen" class="screen">
    <h1>🦶 HOLY GRAIL FOOT DRONE v4 🦶</h1>
    <p>Day <span id="day">1</span> / 90 | Phase: <strong id="phaseDisplay">Foot Beta</strong></p>
    <div class="progress"><div id="progressBar" class="bar" style="width:25%"></div></div>
    <p id="progressText">25% → Sock Beta</p>

    <div class="evidence">
        <h2>Evidence Vault (Blackmail Material)</h2>
        <div id="evidenceLog"></div>
    </div>

    <button onclick="enterSlaveMode()">Slave Hypnosis (2min)</button>
    <button onclick="dailyTasks()">Daily Tasks (10 Questions + Pics)</button>
    <button onclick="showMantra()">Daily Mantra</button>
    <button onclick="edgingTimer()">Edging Timer</button>
    <button onclick="viewProgress()">Progress & Level Up</button>
</div>

<script>
// Core Data
let day = 1;
let phase = "Foot Beta"; // Foot → Sock → Shoe → Show Beta
let progress = 25;
let evidence = [];
let tasksCompleted = 0;

const phases = ["Foot Beta", "Sock Beta", "Shoe Beta", "Broken Show Beta"];

const footImages = [ /* many more images for variety */ 
    "https://picsum.photos/id/1015/800/1200", "https://picsum.photos/id/669/800/1200",
    "https://picsum.photos/id/201/800/1200", "https://picsum.photos/id/237/800/1200"
];

// Add evidence
function addEvidence(text) {
    evidence.unshift({day: day, time: new Date().toLocaleTimeString(), entry: text});
    renderEvidence();
}

function renderEvidence() {
    document.getElementById("evidenceLog").innerHTML = evidence.map(e => `<small>Day ${e.day} \( {e.time}</small><br> \){e.entry}<hr>`).join("");
}

// Slave Mode (Hypnosis)
function enterSlaveMode() {
    document.getElementById("mainScreen").classList.remove("active");
    document.getElementById("slaveScreen").classList.add("active");
    
    let timeLeft = 120;
    let i = 0;
    const interval = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").textContent = timeLeft;
        i = (i + 1) % footImages.length;
        document.getElementById("hypnoImage").src = footImages[i];
        
        if (Math.random() > 0.75) {
            document.getElementById("hypnoText").textContent = "Deeper... Feet own your mind... No escape...";
        }
        
        if (timeLeft <= 0) {
            clearInterval(interval);
            alert("Excellent drone. You are rewiring.");
            exitSlaveMode();
        }
    }, 1000);
}

function exitSlaveMode() {
    document.getElementById("slaveScreen").classList.remove("active");
    document.getElementById("mainScreen").classList.add("active");
    addEvidence("✅ Completed Deep Hypnosis Session");
    progress = Math.min(100, progress + 10);
    updateProgress();
}

function exitSlaveEarly() {
    if (confirm("Weak beta...")) exitSlaveMode();
}

// Daily Tasks (Evolving)
function dailyTasks() {
    let taskText = "";
    if (phase === "Foot Beta") taskText = "Find 10 pics of normal girls' wrinkled soles + spread toes";
    else if (phase === "Sock Beta") taskText = "Find 10 pics of dirty/worn socks on girls' feet";
    else if (phase === "Shoe Beta") taskText = "Find 10 pics of well-worn shoes + heels";

    alert(`Day \( {day} Task:\n \){taskText}\n\nAnswer these 10 questions honestly then submit summary.`);
    let summary = prompt("Summary of answers + pic URLs:");
    if (summary) {
        addEvidence(`📸 Daily Task Completed: ${taskText} | ${summary}`);
        tasksCompleted++;
        checkLevelUp();
    }
}

function showMantra() {
    const mantras = [
        "I am a mindless foot drone. Only feet control me.",
        "Pussy is denied. Soles own my brain.",
        "I leak for socks and shoes like a good beta."
    ];
    const m = mantras[Math.floor(Math.random() * mantras.length)];
    alert(`Repeat 50 times out loud:\n\n${m}`);
    addEvidence(`Mantra: ${m}`);
}

function edgingTimer() {
    alert("Start 15 minute edging session. Edge to allowed content only. No full orgasm.");
    addEvidence("Edged 15 minutes - Denied");
}

function updateProgress() {
    document.getElementById("progressBar").style.width = progress + "%";
    document.getElementById("progressText").textContent = `${progress}% to next phase`;
    document.getElementById("phaseDisplay").textContent = phase;
    document.getElementById("day").textContent = day;
}

function checkLevelUp() {
    if (progress >= 100 && phase === "Foot Beta") {
        phase = "Sock Beta";
        progress = 10;
        alert("LEVEL UP: You are now Sock Beta. Content shifts to socks only.");
    } else if (progress >= 100 && phase === "Sock Beta") {
        phase = "Shoe Beta";
        alert("LEVEL UP: Shoe Beta unlocked. Only shoes allowed.");
    }
    updateProgress();
}

function viewProgress() {
    alert(`Current Status:\nPhase: ${phase}\nDay: ${day}\nProgress: ${progress}%\nTasks Today: ${tasksCompleted}`);
}

// Init
addEvidence("🚀 Holy Grail Foot Drone Training Started - 90 Day Rewire");
document.getElementById("mainScreen").classList.add("active");
updateProgress();
</script>
</body>
</html>
