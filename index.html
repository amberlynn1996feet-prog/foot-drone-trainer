<body>

<!-- 100 QUESTIONS MODAL -->

// Sample foot images for hypno

    "I exist to worship and obey.",
    "No pussy. Only feet.",
    "I am owned by feet."
];

// ===== SLAVE MODE =====
let slaveTimer;
function enterSlaveMode() {
    document.getElementById("mainScreen").classList.remove("active");
    document.getElementById("slaveScreen").classList.add("active");
    let timeLeft = 120;
    document.getElementById("timer").textContent = timeLeft;

    let imgIndex = 0;
    slaveTimer = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").textContent = timeLeft;
        
        // Cycle images
        imgIndex = (imgIndex + 1) % footImages.length;
        document.getElementById("hypnoImage").src = footImages[imgIndex];

        if (timeLeft <= 0) {
            clearInterval(slaveTimer);
            alert("Good drone. You may now enter the main app.");
            exitSlaveMode();
        }
    }, 1000);
}

function exitSlaveMode() {
    clearInterval(slaveTimer);
    document.getElementById("slaveScreen").classList.remove("active");
    document.getElementById("mainScreen").classList.add("active");
    addEvidence("Completed Slave Mode session");
}

function exitSlaveEarly() {
    if (confirm("Are you sure? This is weak beta behavior.")) {
        clearInterval(slaveTimer);
        exitSlaveMode();

// ===== EVIDENCE =====
function addEvidence(text) {
    evidence.push({time: new Date().toLocaleTimeString(), entry: text});
    renderEvidence();
}

function renderEvidence() {
    const log = document.getElementById("evidenceLog");
    log.innerHTML = evidence.map(e => `<p>[${e.time}] ${e.entry}</p>`).join("");
}

    document.getElementById("dailyTask").innerHTML = `<strong>Today's Task:</strong> ${task}`;

// Mantra

function show100Questions() {

    q100.forEach((q,i) => {
        html += `<p>${q}<br><textarea placeholder="Answer here"></textarea></p>`;
    });
    document.getElementById("q100List").innerHTML = html;
    document.getElementById("q100Modal").style.display = "block";
}

function submit100() {
    addEvidence("FULL 100 QUESTIONNAIRE SUBMITTED — Massive evidence added");
    alert("All answers logged as permanent blackmail evidence.");
    document.getElementById("q100Modal").style.display = "none";
}

function close100() {
    document.getElementById("q100Modal").style.display = "none";
}

// Init
addEvidence("Training Started - Phase 1: Foot Beta");
renderEvidence();
alert("App loaded. Enter Slave Mode first every time you open it. Eyes on screen.");
</script>
